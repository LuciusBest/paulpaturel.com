    <section>
      <h2>Projects</h2>
      <p><strong>LOTTOFPRINTS:</strong> Visual identity (print and motion) for ECAL’s lottery game. 2022.</p>
      <p><strong>Synthetic Organic:</strong> A series of eight 3D sculptures, presented in a 20-page A3 booklet printed by inkjet.</p>
      <p><strong>Sens Unik:</strong> Rejected project — proposal for a static and motion visual identity for the music group Sens Unik with 3D imagery of Renens (1020 CH) and multiple logo variations.</p>
      <p><strong>Camille Leprince Website:</strong> Website designed and developed for photographer Camille Leprince (2023).</p>
      <p><strong>Stencil Poster:</strong> Stencil poster cut into wood. Typographic design with Hugo Scholl and Brian Roettinger (2022).</p>
      <p><strong>RLSH:</strong> Editorial work based on Vladislav Iouchkov’s 2017 thesis: “The Hero with a Thousand Graces”: A Socio-Criminological Examination of the Real Life Super Hero Phenomenon. 2022.</p>
      <p><strong>Relay:</strong> Typeface and type specimen developed under the supervision of Aurèle Sack. 2024.</p>
    </section>
