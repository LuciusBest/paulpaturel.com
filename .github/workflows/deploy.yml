name: Deploy site via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Deploy to o2switch via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: ./public/
          state-name: ftp-state-v2.json
          dangerous-clean-slate: true

      - name: Ensure siteVersion.json uploaded
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          REMOTE_BASE="${FTP_REMOTE_DIR%/}"
          curl --ftp-ssl --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file public/data/siteVersion.json \
            "ftp://${FTP_HOST}${REMOTE_BASE}/data/siteVersion.json"
